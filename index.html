   segments.forEach((row,r)=>{
     points.push([pos,r+0.45]);

   });
   return {end:pos,points};
 };

}

 for(const e of enemies){const name=(mode==='rescue'||mode==='rescueLanding')?rescueNames[e.type]:workNames[e.type];const color=(mode==='rescue'||mode==='rescueLanding')?['#a0749e','#a3a06e','#d5a16c','#d16f75','#e5a86e'][e.type]:['#6a88a6','#aa9563','#d34b58','#ac7894','#738e9d','#ffad68'][e.type];character(e.x,e.y,color,false,false,e.small?1:1);text(name,e.x+e.w/2,e.y-13,e.small?12:14,'#fff');if(mode==='boss'&&e.type===2)text('⚡',e.x+e.w/2,e.y-33,20,'#ff6471');if(mode==='boss'&&e.type===3)text('×3',e.x+e.w/2,e.y-31,16,'#ffd08a');if(e.shield){if(mode==='boss')text('🛡'+e.shield,e.x+19,e.y-50,17,'#ff9c9c');c.strokeStyle=mode==='boss'?'#ff404f':'#82d7ff';c.lineWidth=4;c.beginPath();c.arc(e.x+18,e.y+28,37,0,7);c.stroke()}}
for(const h of hazards){if(h.kind==='speech'){c.fillStyle='#ffb4d0';c.beginPath();c.arc(h.x,h.y,12,0,7);c.fill();text('!',h.x,h.y+5,15,'#8d244d')}else if(h.kind==='grenade'){c.fillStyle='#99b276';c.beginPath();c.arc(h.x,h.y,12,0,7);c.fill()}else if(h.kind==='meteor'){text('☄️',h.x,h.y,37,'#ff9b56')}else if(h.kind==='flame'){c.fillStyle='#ff6b26';c.beginPath();c.arc(h.x,h.y,17,0,7);c.fill();text('🔥',h.x,h.y+6,22,'#ffd276')}else rect(h.x,h.y,15,6,'#ff9a8a')}
for(const p of papers){rect(p.x-15,p.y-11,31,22,'#f5f1e5');rect(p.x-9,p.y-5,18,2,'#8292a1');rect(p.x-9,p.y+2,17,2,'#8292a1')}
if(bossStomp>0){bossStomp=Math.max(0,bossStomp-.016);text('쿵!',boss.x-10,boss.y-25,34,'#ffac65')}for(const z of zones){c.beginPath();c.ellipse(z.x,G-2,z.r,39,0,0,7);c.fillStyle=z.warning>0?'#f04a4a77':'#ffa04bbb';c.fill();c.strokeStyle=z.warning>0?'#ff4545':'#ffd06a';c.lineWidth=5;c.stroke()}
for(const a of coffees){text('☕',a.x,a.y,36);text('+10',a.x,a.y-35,15,'#94ffba')}
}for(const b of bullets){if(rank>=3&&mode!=='bonus'){if(b.turret){rect(b.x,b.y,15,5,'#8af6ff')}else if(rank===5){rect(b.x,b.y,19,5,'#ffe58e');rect(b.x-4,b.y-1,7,7,'#fff8ca')}else{rect(b.x,b.y-7,17,4,'#ffe58e');rect(b.x,b.y+7,17,4,'#ffe58e');rect(b.x-4,b.y-8,6,5,'#fff8ca');rect(b.x-4,b.y+6,6,5,'#fff8ca')}}else rect(b.x,b.y,19,6,'#ffe58e')}if((mode==='resultDelay'||mode==='result')&&bossCorpse){const age=2-resultTimer,scale=age<.28?1.4-age/.28*.4:1;c.save();c.translate(480,245);c.scale(scale,scale);rect(-335,-105,670,248,'#101a2be9');text('STAGE CLEAR!',0,-20,64,'#ffda72');c.restore();if(clearStats){text('클리어 타임  '+clearStats.time,480,275,23,'#fff1c9');text('처치 몬스터  '+clearStats.kills+'마리',480,311,23,'#f4f5ff');text('남은 HP  '+clearStats.hp+'%',480,347,23,'#a6ffca')}}for(const p of particles){if(p.casing){c.save();c.translate(p.x,p.y);c.rotate(t*11);rect(-5,-2,10,4,p.color);c.restore()}else rect(p.x,p.y,6,6,p.color)}}
function drawCinema(){
 const sec=cinemaTime;c.fillStyle='#080b17';c.fillRect(0,0,W,H);
 for(let i=0;i<65;i++){const xx=(i*137+sec*13)%W,yy=(i*79+sec*22)%H;c.fillStyle=i%3===0?'#ffd577':'#a5bed8';c.globalAlpha=.14+.12*Math.sin(sec*2+i);c.fillRect(xx,yy,3,3)}c.globalAlpha=1;
 if(sec<2.2){const scale=1+Math.sin(sec*6)*.045;c.save();c.translate(W/2,H/2);c.scale(scale,scale);text('VICTORY!',0,0,90,'#ffda72');c.restore();text('FINAL STAGE CLEAR',480,337,26,'#f4e7c6');if(sec<.5)burst(480,245,'#ffdb77',10)}
 else if(sec<5.3){text('AMBITION ENDING',480,92,28,'#f6d783');character(420,165,'#32badc',true,false,2.3);text('모두 여러분 덕분입니다.',480,390,32,'#ffffff');text('감사합니다!',480,440,32,'#f3d482')}
 else {text('AMBITION ENDING',480,91,26,'#c6b789');text('이 회사는',480,236,65,'#fff5dc');text('이제 제 겁니다.',480,323,75,'#ffd36c');text('최종 클리어 · THE END',480,414,25,'#f2dfad')}
 rect(270,494,420*(Math.min(sec,cinemaDuration)/cinemaDuration),4,'#eacb78');
}
function tick(now){const dt=Math.min((now-last)/1000,.045)||.016;last=now;if(mode==='mini'&&!miniDone){if(rank===4&&miniState.memory&&miniState.memory.phase==='memorize'){miniState.memory.remaining-=dt;const clock=document.getElementById('miniClock');if(clock)clock.textContent=Math.ceil(Math.max(0,miniState.memory.remaining));if(miniState.memory.remaining<=0)memoryReveal()}else if(!miniBusy){miniTimer-=dt;const clock=document.getElementById('miniClock');if(clock)clock.textContent=Math.ceil(Math.max(0,miniTimer));if(miniTimer<=0)miniFailure()}}if(active())update(dt);else if(mode==='rescueLanding'){t+=dt;if(t>2)nextStage()}else if(mode==='bossDeath'){bossDeathTime-=dt;if(bossDeathTime<=0)nextStage()}else if(mode==='resultDelay'){resultTimer-=dt;if(resultTimer<=0&&resultAction){const fn=resultAction;resultAction=null;fn()}}else if(mode==='cinematic'){cinemaTime+=dt;if(cinemaTime>=cinemaDuration){lobby();}}draw();if(mode==='receipt'){const order=bonusOrders[rank];const rows=order.items.map(it=>`<div class="line"><span>${it[0]}</span><b>${fmt(it[1]*it[2])}</b></div>`).join('');const receipt=`<h1 class="bonus-title">보너스 타임!</h1><small>${order.title}</small><div class="receipt"><h2>예산 내역서</h2><hr>${rows}<hr><h2 class="bonus-question">얼마일까요?</h2><small>정답은 표시되지 않습니다.</small></div><div class="count">${Math.ceil(Math.max(0,receiptSeconds))}</div><small>5초 후 30초 사격 게임 시작 · 총알 5발</small>`;show(receipt)}requestAnimationFrame(tick)}
function canvasPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}cv.addEventListener('pointerdown',e=>{if(rank===5&&mode==='boss'){
 const p=canvasPos(e);if(turretMode>=0){turretPlace(turretMode,p.x);return;}
 const idx=turrets.findIndex(tr=>tr.placed&&!tr.dead&&Math.abs(tr.x+22-p.x)<36&&Math.abs(tr.y+22-p.y)<48);
 if(idx>=0){dragTurret=idx;cv.setPointerCapture(e.pointerId);return;}
 }if(mode==='bonus'){const p=canvasPos(e);bonusAimY=clamp(p.y,148,425)}else if(mode==='rescue'||mode==='boss'){const p=canvasPos(e);tutorialMark('fire');shoot(p)}});
cv.addEventListener('pointermove',e=>{if(dragTurret>=0&&rank===5&&mode==='boss'){const p=canvasPos(e);const tr=turrets[dragTurret];if(tr&&!tr.dead)tr.x=clamp(p.x-22,45,695)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,()=>{if(dragTurret>=0){dragTurret=-1;refreshTurretButtons()}});
const pressed={};document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(key==='jump'){tutorialMark('jump');if(mode==='bonus')bonusAimY=clamp(bonusAimY-32,148,425);else jump()}else if(key==='heal'){useCoffee()}else if(key==='boost'){useBoost()}else if(key==='shield'){tutorialMark('shield');if(mode==='bonus')bonusAimY=clamp(bonusAimY+32,148,425);else shield()}else if(key==='fire'){tutorialMark('fire');keys.fire=true;shoot()}else keys[key]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(key==='left'||key==='right'||key==='fire')keys[key]=false})});
let memoryDigits='';
function normalizedKey(e){if(e.code==='Space'||e.key===' '||e.key==='Spacebar')return 'Space';if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='Enter')return e.key;const k=(e.code||e.key||'').toLowerCase();if(k==='keya'||k==='a')return 'KeyA';if(k==='keyd'||k==='d')return 'KeyD';if(k==='keyw'||k==='w')return 'KeyW';if(k==='keyf'||k==='f')return 'KeyF';if(k==='keys'||k==='s')return 'KeyS';return e.code||e.key}
// QA shortcuts: K = instant combat clear, B = instant budget clear.
function debugClearCombat(){
 if(mode==='rescue'){
  spawned=configs[rank].rescueTotal;
  enemies.length=0;hazards.length=0;bullets.length=0;
  killed=spawned;winRescue=true;
  nextStage();
 }else if(mode==='boss'){
  enemies.length=0;hazards.length=0;papers.length=0;zones.length=0;
  if(boss){boss.hp=0;bossAppeared=true;bossCorpse=true;bossDeathTime=1.35;mode='bossDeath';clearStats={time:Math.floor(bossFightTime/60).toString().padStart(2,'0')+':'+Math.floor(bossFightTime%60).toString().padStart(2,'0'),kills:bossKillCount,hp:Math.round(player.hp/player.max*100)};hide();}
 }
}
function debugClearBonus(){
 if(mode==='receipt'){mode='bonus';hide();}
 if(mode==='bonus')nextStage();
 if(mode==='mini')miniSuccess();
}
document.addEventListener('keydown',e=>{const k=normalizedKey(e);
 if(!e.repeat && (e.code==='KeyK'||e.key.toLowerCase()==='k') && (mode==='rescue'||mode==='boss')){e.preventDefault();debugClearCombat();return;}
 if(!e.repeat && (e.code==='KeyB'||e.key.toLowerCase()==='b') && (mode==='receipt'||mode==='bonus'||mode==='mini')){e.preventDefault();debugClearBonus();return;}
if(mode==='mini'&&rank===4&&miniState.memory?.phase==='answer'&&!e.repeat){const digit=/^[1-9]$/.test(e.key)?Number(e.key)-1:e.key==='0'?9:-1;if(digit>=0){e.preventDefault();memoryPick(digit);return}}
if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space','KeyF','KeyE','KeyQ','Enter'].includes(k))e.preventDefault();if(mode==='lobby'){if((k==='ArrowLeft'||k==='KeyA')&&!e.repeat){lobbySelection=0;refreshLobbySelection()}if((k==='ArrowRight'||k==='KeyD')&&!e.repeat){lobbySelection=1;refreshLobbySelection()}if(k==='Space'&&!e.repeat)chooseLobby();return}if(k==='ArrowLeft'||k==='KeyA')keys.left=true;if(k==='ArrowRight'||k==='KeyD')keys.right=true;if(mode==='bonus'&&(k==='ArrowUp'||k==='KeyW'))bonusAimY=clamp(bonusAimY-32,148,425);else if(mode==='bonus'&&(k==='ArrowDown'||k==='KeyS'))bonusAimY=clamp(bonusAimY+32,148,425);else if((k==='ArrowUp'||k==='KeyW')&&!e.repeat){tutorialMark('jump');jump()}if(k==='Space'&&overlay.classList.contains('hidden')){keys.fire=true;if(!e.repeat){tutorialMark('fire');shoot()}}if(k==='KeyF'&&!e.repeat){tutorialMark('shield');shield()}if(k==='KeyE'&&!e.repeat)useCoffee();if(k==='KeyQ'&&!e.repeat)useBoost();if(k==='Space'&&!e.repeat&&overlay&&!overlay.classList.contains('hidden')){const action=panel.querySelector('button.reply,button');if(action)action.click()}},true);
document.addEventListener('keyup',e=>{const k=normalizedKey(e);if(k==='Space')keys.fire=false;if(k==='ArrowLeft'||k==='KeyA')keys.left=false;if(k==='ArrowRight'||k==='KeyD')keys.right=false});
window.addEventListener('blur',()=>{keys.left=keys.right=keys.fire=false});lobby();requestAnimationFrame(n=>{last=n;tick(n)});
})();
